# llmverify reference snapshot
#
# What a first-party endpoint of each model looks like, and what it scores. Every
# number here is what a verdict is measured against, so each one carries its
# source, the date it was read and a confidence level.
#
# confidence
#   primary      the lab's own publication
#   independent  Epoch AI, ARC Prize, Artificial Analysis
#   secondary    press or third-party write-ups, including figures triangulated
#                from convergent summaries when the lab published only images
#   unverified   flagged as unconfirmed at the source
#
# Conventions
#   * effort, tools and optimized are filled only when the publisher stated them.
#     Null means unknown, never "default". Comparing scores across efforts is
#     invalid, and a wrong effort label is how this tool would accuse an honest
#     provider of fraud.
#   * training_cutoff holds the cutoff a vendor publishes. knowledge_cutoff is
#     reserved for a cutoff that has actually been measured by probing, which is
#     usually earlier, and is left null throughout this snapshot.
#   * Where a vendor gives only a month, the date is recorded as the first of
#     that month. Treat month precision as the real resolution.
#   * ModelRecord.score_for ranks primary above independent. A lab number with no
#     stated effort will therefore win over Epoch's conditioned run unless the
#     caller passes effort=. Callers should pass it.
#   * Benchmark keys distinguish variants that are not comparable:
#     swe_bench_verified / swe_bench_pro / swe_bench_pro_public, and
#     terminal_bench (Epoch, v2.0 leaderboard) / terminal_bench_2_0 /
#     terminal_bench_2_1 / terminal_bench_hard / terminal_bench_1_0.
#   * Saturated benchmarks are marked in the relevant notes. GPQA Diamond spans
#     only 71.3 to 92.8 across 35 current models with a standard deviation of 5.0
#     and has 198 items; separating two frontier models on it alone would need
#     tens of thousands of items. Never use it by itself.
#
#   * aa_intelligence_index, aa_coding_index and aa_agentic_index are Artificial
#     Analysis composites rather than single benchmarks. They are comparable
#     across models because Artificial Analysis fixes the conditions, but those
#     conditions are not published per model, so treat them as weak evidence.
#
# Attribution
#   Epoch AI's Capabilities Index data is CC-BY and must be credited; see NOTICE.
#   Artificial Analysis index values reach this file through OpenRouter's public
#   API and carry Artificial Analysis's own terms.
#
# Regenerate the machine-readable parts with llmverify.reference.refresh, which
# diffs against this file rather than overwriting it. Rewriting the file drops
# these comments, so keep provenance prose in `notes` fields, which survive.
schema_version: 1
as_of: '2026-07-26'
generated_by: manual
sources:
  epoch_eci: https://epoch.ai/data/eci_benchmarks.csv
  openrouter_models: https://openrouter.ai/api/v1/models
  openrouter_endpoints: https://openrouter.ai/api/v1/models/{author}/{slug}/endpoints
  artificial_analysis: https://artificialanalysis.ai/api/v2/data/llms/models
  arc_prize: https://arcprize.org/leaderboard
  terminal_bench: https://www.tbench.ai/leaderboard/terminal-bench/2.0
  aider_polyglot: https://raw.githubusercontent.com/Aider-AI/aider/main/aider/website/_data/polyglot_leaderboard.yml
  anthropic_docs: https://platform.claude.com/docs/
  anthropic_claude_opus_5: https://www.anthropic.com/news/claude-opus-5
  openai_docs: https://developers.openai.com/api/docs/
  openai_gpt_5_6: https://openai.com/index/gpt-5-6/
  xai_docs: https://docs.x.ai/
  helm: https://storage.googleapis.com/crfm-helm-public/
  huggingface_datasets_server: https://datasets-server.huggingface.co/
  lmarena: https://datasets-server.huggingface.co/rows?dataset=lmarena-ai%2Fleaderboard-dataset&config=text&split=latest&offset=0&length=100
families:
- family: anthropic
  response_id_prefix: msg_
  supports_logprobs: false
  supports_seed: false
  has_system_fingerprint: false
  usage_keys:
  - input_tokens
  - output_tokens
  - cache_creation_input_tokens
  - cache_read_input_tokens
  - cache_creation
  - server_tool_use
  - output_tokens_details
  finish_reasons:
  - end_turn
  - max_tokens
  - stop_sequence
  - tool_use
  - pause_turn
  - refusal
  - model_context_window_exceeded
  notes: 'Keys are the top level of the usage object; cache_creation nests ephemeral_5m_input_tokens
    and ephemeral_1h_input_tokens, and output_tokens_details nests thinking_tokens. Responses also
    carry service_tier (standard, priority or batch), inference_geo and container. The strongest signal
    in this family is the thinking-block signature: Anthropic encrypts thinking content and verifies
    the signature when the block is replayed, so a tampered value returns 400 and a reseller cannot
    produce a valid one without routing through genuine Anthropic inference. Two absences are as diagnostic
    as any presence -- an endpoint claiming a Claude model while honouring seed or returning logprobs
    is not Anthropic. POST /v1/messages/count_tokens exposes the real tokenizer free of charge. Anthropic
    warns that serving infrastructure changes can alter observable behaviour while model id and weights
    stay fixed, so behavioural-drift detectors will produce false positives against first-party Anthropic.'
- family: openai
  response_id_prefix: chatcmpl-
  supports_logprobs: true
  supports_seed: true
  has_system_fingerprint: true
  usage_keys:
  - prompt_tokens
  - completion_tokens
  - completion_tokens_details
  notes: Shape given is Chat Completions, which is what this package's OpenAI adapter speaks. completion_tokens_details
    nests reasoning_tokens, audio_tokens, accepted_prediction_tokens and rejected_prediction_tokens.
    The Responses API is a different shape -- input_tokens and output_tokens with only output_tokens_details.reasoning_tokens
    -- which makes the usage object a reliable discriminator between the two endpoints. top_logprobs
    accepts 0 to 20 and untracked tokens report a logprob of -9999.0; note that LiteLLM's documentation
    still claims a 0 to 5 range. system_fingerprint is present but soft-deprecated on Chat Completions
    and absent from Responses; seed is likewise Chat Completions only, and OpenAI does not guarantee
    determinism from it. Reasoning models appear to refuse logprobs in practice, but that could not
    be confirmed as an absolute rule. The finish_reason vocabulary was not re-verified for this snapshot
    and is therefore left empty rather than filled from memory.
- family: gemini
  has_system_fingerprint: false
  usage_keys:
  - promptTokenCount
  - cachedContentTokenCount
  - candidatesTokenCount
  - toolUsePromptTokenCount
  - thoughtsTokenCount
  - totalTokenCount
  notes: 'Keys are the top level of usageMetadata. GenerateContentResponse echoes modelVersion, which
    is the closest thing this family has to an identity field, and there is no system_fingerprint
    anywhere. A countTokens endpoint exists. supports_logprobs and supports_seed are left null on
    purpose: responseLogprobs, avgLogprobs and seed could not be reconfirmed against Google''s own
    documentation for this snapshot, and the only evidence to hand is OpenRouter''s parameter list,
    which advertises seed but not logprobs for Gemini models while exposing logprobs for the open
    Gemma models. The v1beta models endpoint returns 403 without a key, so the catalogue cannot be
    read anonymously.'
