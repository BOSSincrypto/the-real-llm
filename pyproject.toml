[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmverify"
version = "0.1.0"
description = "Verify that a custom LLM provider actually serves the model it claims to serve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "llmverify contributors" }]
keywords = [
    "llm",
    "model-verification",
    "provider-audit",
    "benchmark",
    "fingerprinting",
    "quantization-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Deliberately minimal. Every statistical test in `llmverify.stats` is implemented
# in pure Python against the standard library, so numpy/scipy are NOT required.
# Benchmark datasets are read over the HuggingFace datasets-server REST API,
# so `datasets`/`pyarrow` are NOT required either.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/BOSSincrypto/the-real-llm"
Issues = "https://github.com/BOSSincrypto/the-real-llm/issues"

[project.scripts]
llmverify = "llmverify.cli:main"

# Third-party adapters register themselves here; see docs/adapters.md.
[project.entry-points."llmverify.adapters"]
openai = "llmverify.adapters.openai_compat:OpenAICompatAdapter"
anthropic = "llmverify.adapters.anthropic:AnthropicAdapter"
gemini = "llmverify.adapters.gemini:GeminiAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/llmverify"]

[tool.hatch.build.targets.sdist]
include = ["src/llmverify", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
